name: Build CustomCore Plugin

# Läuft bei jedem Push auf main/master sowie manuell über den "Run workflow"-Button
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Mit Maven bauen
        run: mvn -B clean package

      - name: Fertige JAR als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CustomCore-Plugin
          path: target/CustomCore.jar
          if-no-files-found: error
